<!DOCTYPE html>
<html>

<body>

    <h2 id="title">
        Hello JavaScript
    </h2>

    <button id="removeBtn">
Remove Heading
</button>

    <script>
        const button =
            document.getElementById("removeBtn");

        button.addEventListener("click", () => {

            const heading =
                document.getElementById("title");

            // Remove element
            heading.remove();

        });
    </script>

</body>

</html>
