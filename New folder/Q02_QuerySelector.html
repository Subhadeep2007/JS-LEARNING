<!DOCTYPE html>
<html>

<body>

    <h2 class="heading">
        Hello World
    </h2>

    <button onclick="changeColor()">
Change Color
</button>

    <script>
        const changeColor = () => {

            // Select first matching element
            const heading =
                document.querySelector(".heading");

            // Change CSS
            heading.style.color = "red";

        };
    </script>

</body>

</html>
